name: Worker

on:
  push:
    paths:
      - "workers/incident-simulator/**"
      - ".github/workflows/worker.yml"
  pull_request:
    paths:
      - "workers/incident-simulator/**"
      - ".github/workflows/worker.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/incident-simulator
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            workers/incident-simulator/package-lock.json
            workers/incident-simulator/ui/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build UI
        run: npm run build

      - name: Dry-run deploy
        run: npx wrangler deploy --dry-run --outdir /tmp/incident-simulator-dryrun
