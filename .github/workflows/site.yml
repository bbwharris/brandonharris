name: Site

on:
  push:
    paths:
      - "content/**"
      - "layouts/**"
      - "static/**"
      - "themes/**"
      - "config.toml"
      - ".hugoversion"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "content/**"
      - "layouts/**"
      - "static/**"
      - "themes/**"
      - "config.toml"
      - ".hugoversion"
      - ".github/workflows/site.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read Hugo version
        id: hugo-version
        run: echo "version=$(tr -d '[:space:]' < .hugoversion)" >> "$GITHUB_OUTPUT"

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ steps.hugo-version.outputs.version }}
          extended: true

      - name: Build
        run: hugo --gc --minify

      - name: Check internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --root-dir public public
