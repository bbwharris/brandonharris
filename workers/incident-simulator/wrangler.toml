name = "incident-simulator"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false
upload_source_maps = true

[observability]
enabled = true

[build]
command = "npm run build"

# Serve the React UI from the worker via ASSETS binding so security headers
# and redirects apply consistently across all routes.
[assets]
directory = "./ui/dist"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

# Durable Object for incident state persistence
[[durable_objects.bindings]]
name = "IncidentAgent"
class_name = "IncidentAgent"

# Initial migration to create SQLite table
[[migrations]]
tag = "v1"
new_sqlite_classes = ["IncidentAgent"]

# Workers AI binding for Llama 3.1
[ai]
binding = "AI"

# IP-level rate limiting for agent HTTP/WebSocket endpoints
[[ratelimits]]
name = "INCIDENT_RATE_LIMIT"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

# Production environment variable
[vars]
ENVIRONMENT = "production"

# Custom domain configuration (handles all paths on agents.brandon-harris.com)
[[routes]]
pattern = "agents.brandon-harris.com"
zone_name = "brandon-harris.com"
custom_domain = true
