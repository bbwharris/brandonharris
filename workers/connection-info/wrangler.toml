name = "connection-info"
main = "src/index.ts"
compatibility_date = "2025-01-01"
workers_dev = true
preview_urls = false
upload_source_maps = true

[observability]
enabled = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

[[ratelimits]]
name = "CONNECTION_RATE_LIMIT"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[[routes]]
pattern = "info.brandon-harris.com"
zone_name = "brandon-harris.com"
custom_domain = true
