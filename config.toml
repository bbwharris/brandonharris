baseurl = "https://brandon-harris.com"
title = "Brandon Harris"
locale = "en-US"
enableRobotsTXT = true
theme = "PaperMod"
[pagination]
pagerSize = 10

[author]
name = "Brandon Harris"

[params]
description = "Welcome. I'm Brandon Harris, VP of Engineering at Cloudflare. I lead engineering teams building infrastructure at global scale."
keywords = ["Brandon Harris", "VP Engineering", "Cloudflare", "Leadership", "Engineering Management"]
author = "Brandon Harris"
images = ["/images/og-default.png"]
mainSections = ["archive"]
DateFormat = "January 2, 2006"
defaultTheme = "auto"
ShowReadingTime = true
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowWordCount = true
ShowRssButtonInSectionTermList = true
UseHugoToc = true
comments = false

[params.profileMode]
enabled = true
subtitle = "VP of Engineering at Cloudflare"
buttons = [
    {name = "About", url = "/about/"},
    {name = "Writing", url = "/posts/"},
    {name = "Projects", url = "/projects/"}
]

[[params.socialIcons]]
name = "linkedin"
url = "https://www.linkedin.com/in/bbwharris"

[[params.socialIcons]]
name = "github"
url = "https://github.com/bbwharris"

[[params.socialIcons]]
name = "twitter"
url = "https://twitter.com/bbwharris"

[[params.socialIcons]]
name = "strava"
url = "https://www.strava.com/athletes/bbwharris"

[params.assets]
disableFingerprinting = false
favicon = "/favicon.svg"
favicon16x16 = "/favicon-16x16.png"
favicon32x32 = "/favicon-32x32.png"
apple_touch_icon = "/apple-touch-icon.png"
safari_pinned_tab = "/safari-pinned-tab.svg"
theme_color = "#0b1220"

[params.label]
text = "Home"
icon = "/apple-touch-icon.png"
